<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/jpeg" href="/weplm.jpeg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0C2086" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SignForge" />
    <link rel="apple-touch-icon" href="/weplm.jpeg" />
    <title>SignForge - We.PLM</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('signforge_theme_preference');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
