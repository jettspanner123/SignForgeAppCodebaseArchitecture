server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: SignForgeOrchestratorServiceLayerMSC
  jackson:
    serialization:
      indent-output: true
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

signforge:
  security:
    cors:
      allowed-origins:
        - "http://localhost:5173"
        - "http://localhost:3000"
        - "https://signforge.theweplm.com"
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers: "*"
      allow-credentials: true
