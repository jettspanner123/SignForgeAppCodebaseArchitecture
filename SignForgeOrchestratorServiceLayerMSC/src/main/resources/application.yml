server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: SignForgeOrchestratorServiceLayerMSC
  datasource:
    url: ${SIGNFORGE_DATABASE_URL:jdbc:postgresql://db.apzfodnvbvvpxalsxltv.supabase.co:5432/postgres?sslmode=require}
    username: ${SIGNFORGE_DB_USERNAME:postgres}
    password: ${SIGNFORGE_DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        show_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false
  jackson:
    property-naming-strategy: UPPER_CAMEL_CASE
    serialization:
      indent-output: true
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

signforge:
  security:
    cors:
      allowed-origins:
        - "http://localhost:5173"
        - "http://localhost:3000"
        - "https://signforge.theweplm.com"
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers: "*"
      allow-credentials: true
