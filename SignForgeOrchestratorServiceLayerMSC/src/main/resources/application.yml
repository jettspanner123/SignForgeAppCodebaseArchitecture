server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: SignForgeOrchestratorServiceLayerMSC
  datasource:
    url: ${SIGNFORGE_DATABASE_URL:jdbc:postgresql://aws-0-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${SIGNFORGE_DB_USERNAME:postgres.apzfodnvbvvpxalsxltv}
    password: ${SIGNFORGE_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 10000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
        jdbc:
          lob:
            non_contextual_creation: true
    open-in-view: false
  jackson:
    property-naming-strategy: UPPER_CAMEL_CASE
    serialization:
      indent-output: true
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

signforge:
  database:
    seed: ${SIGNFORGE_DATABASE_SEED:false}
  jwt:
    secret: ${SIGNFORGE_JWT_SECRET:SignForgeSuperEnterpriseSecretKey2026SecureLongJwtTokenSigningKey!}
    issuer: ${SIGNFORGE_JWT_ISSUER:SignForgeOrchestrator}
    audience: ${SIGNFORGE_JWT_AUDIENCE:SignForgeClient}
  security:
    cors:
      allowed-origins:
        - "http://localhost:5173"
        - "http://localhost:3000"
        - "https://signforge.theweplm.com"
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers: "*"
      allow-credentials: true

